# =====================================================
# docker-compose pour le chatbot RNCP Dev IA
# =====================================================
# Orchestre 2 services :
#   - qdrant  : la base vectorielle (image officielle)
#   - app     : notre chatbot Chainlit (build local depuis le Dockerfile)
#
# Lancement :
#   1. cp .env.example .env  (et remplir MISTRAL_API_KEY)
#   2. docker compose up qdrant -d  (démarre Qdrant en arrière-plan)
#   3. uv run python -m src.ingest  (indexe le PDF — UNE FOIS)
#   4. docker compose up  (lance toute la stack)
#
# L'app est accessible sur http://localhost:8000
# Le dashboard Qdrant sur http://localhost:6333/dashboard

services:
  # ---------------------------------------------------
  # Qdrant — vector store
  # ---------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatbot-rncp-qdrant
    ports:
      - "6333:6333"        # API REST
      - "6334:6334"        # gRPC (plus rapide, pas utilisé ici)
    volumes:
      # Persistence des vecteurs : sans ce volume, on perdrait l'index à chaque redémarrage
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo OK"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------
  # App Chainlit
  # ---------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot-rncp-app
    ports:
      - "8000:8000"
    env_file:
      - .env                # injection des secrets (MISTRAL_API_KEY)
    environment:
      # Override de l'URL Qdrant pour pointer vers le service Docker (pas localhost)
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    # Si on veut reload automatique en dev, monter le code en bind mount :
    # volumes:
    #   - ./src:/app/src
    #   - ./app.py:/app/app.py

# ---------------------------------------------------
# Volumes nommés (gérés par Docker, persistants)
# ---------------------------------------------------
volumes:
  qdrant_storage:
